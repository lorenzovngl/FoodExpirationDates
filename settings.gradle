pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id("com.android.settings") version "9.5.3" apply false
    }
}

plugins {
    id("com.android.settings")
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

android {
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    minSdk {
        version = release(26)
    }
    targetSdk {
        version = release(37)
    }
}

rootProject.name = "FoodExpirationDates"
include ':app'
include ':translation-analyzer'
include ':feature:news'
include ':feature:onboarding'
includeBuild("build-logic")
